{% extends "base.html" %}{% block title %}Log in · ProofLoom{% endblock %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto"><h2>Log in</h2>
<label for="email">Email</label><input id="email" type="email" autocomplete="email">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<div class="row" style="margin-top:14px"><button id="go">Log in</button></div><div class="err" id="err"></div>
<p class="sub" style="margin-top:14px">New here? <a href="/register">Create an account</a>.</p></div>
{% endblock %}{% block scripts %}<script>document.getElementById('go').onclick=async()=>{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});const j=await r.json();if(!r.ok){err.textContent=j.error||'Login failed';return}localStorage.setItem('pl_token',j.token);location.href='/'}</script>{% endblock %}

{% extends "base.html" %}{% block title %}Register · ProofLoom{% endblock %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto"><h2>Create account</h2>
<label for="name">Name (optional)</label><input id="name">
<label for="email">Email</label><input id="email" type="email" autocomplete="email">
<label for="password">Password (8+ characters)</label><input id="password" type="password" autocomplete="new-password">
<div class="row" style="margin-top:14px"><button id="go">Create account</button></div><div class="err" id="err"></div>
<p class="sub" style="margin-top:14px">Have an account? <a href="/login">Log in</a>.</p></div>
{% endblock %}{% block scripts %}<script>document.getElementById('go').onclick=async()=>{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,email:email.value,password:password.value})});const j=await r.json();if(!r.ok){err.textContent=j.error||'Signup failed';return}localStorage.setItem('pl_token',j.token);location.href='/'}</script>{% endblock %}
